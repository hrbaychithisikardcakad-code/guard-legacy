<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบบันทึกจุดตรวจ - หมู่บ้านเลกาซี่</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style> body { -webkit-tap-highlight-color: transparent; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

  <header class="bg-indigo-900 border-b border-indigo-950 p-4 sticky top-0 z-50 shadow-md text-white">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-white backdrop-blur-sm">
          <i class="fa-solid fa-house-chimney-window text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">LEGACY PATROL</h1>
          <p class="text-xs text-indigo-200">ระบบบันทึกจุดตรวจ (หมู่บ้านเลกาซี่)</p>
        </div>
      </div>
      <span id="liveClock" class="text-xs font-mono bg-indigo-950 px-2.5 py-1 rounded-full text-indigo-200 border border-indigo-700 font-bold">00:00:00</span>
    </div>
  </header>

  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-5">
    <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-3">
      <div class="flex justify-between items-start">
        <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-indigo-50 text-indigo-700 border border-indigo-200">
          หมู่บ้านเลกาซี่
        </span>
        <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">LEGACY</span>
      </div>
      <div>
        <h2 id="checkpointName" class="text-xl font-bold text-slate-900 leading-snug">กำลังโหลดจุดตรวจ...</h2>
        <p id="checkpointIdText" class="text-xs text-slate-500 mt-1">ID: -</p>
      </div>
    </div>

    <form id="patrolForm" class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-5">
      <div class="space-y-3">
        <label class="block text-xs font-semibold text-slate-700">เจ้าหน้าที่ รปภ. ปฏิบัติหน้าที่ *</label>
        <div class="relative">
          <select id="guardSelect" required onchange="toggleCustomGuardInput()"
            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 pl-10 appearance-none">
            <option value="">กำลังโหลดรายชื่อ รปภ. ...</option>
          </select>
          <i class="fa-solid fa-user-shield absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
          <i class="fa-solid fa-chevron-down absolute right-3.5 top-3.5 text-slate-400 text-sm pointer-events-none"></i>
        </div>
        <div id="customGuardWrapper" class="hidden relative">
          <input type="text" id="customGuardInput" placeholder="พิมพ์ชื่อ-นามสกุลของคุณที่นี่..."
            class="w-full bg-indigo-50/50 border border-indigo-300 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 pl-10">
          <i class="fa-solid fa-pen-to-square absolute left-3.5 top-3.5 text-indigo-600 text-sm"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-2">ถ่ายรูปหลักฐานจุดตรวจ *</label>
        <input type="file" id="nativeCameraInput" accept="image/*" capture="environment" class="hidden">
        <div id="uploadBox" onclick="document.getElementById('nativeCameraInput').click()" 
          class="border-2 border-dashed border-slate-300 hover:border-indigo-500 bg-slate-50 rounded-2xl p-5 text-center cursor-pointer transition-all duration-200">
          <div id="uploadPlaceholder" class="space-y-2 py-3">
            <div class="w-12 h-12 rounded-full bg-indigo-50 mx-auto flex items-center justify-center text-indigo-600 border border-indigo-100">
              <i class="fa-solid fa-camera text-xl"></i>
            </div>
            <p class="text-sm font-semibold text-slate-700">แตะเพื่อเปิดกล้องถ่ายภาพ</p>
          </div>
          <div id="previewWrapper" class="hidden relative">
            <img id="imagePreview" src="" alt="Preview" class="w-full h-56 object-cover rounded-xl border border-slate-200">
          </div>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-2">สถานะจุดตรวจ *</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="cursor-pointer">
            <input type="radio" name="status" value="NORMAL" checked class="peer hidden">
            <div class="p-3 text-center rounded-xl border border-slate-200 bg-slate-50 peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-700 text-slate-500 transition-all">
              <i class="fa-solid fa-circle-check block text-xl mb-1 text-emerald-500"></i>
              <span class="text-xs font-bold">ปกติ</span>
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="status" value="ABNORMAL" class="peer hidden">
            <div class="p-3 text-center rounded-xl border border-slate-200 bg-slate-50 peer-checked:bg-rose-50 peer-checked:border-rose-500 peer-checked:text-rose-700 text-slate-500 transition-all">
              <i class="fa-solid fa-triangle-exclamation block text-xl mb-1 text-rose-500"></i>
              <span class="text-xs font-bold">ผิดปกติ</span>
            </div>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">หมายเหตุเพิ่มเติม (ถ้ามี)</label>
        <textarea id="noteInput" rows="2" placeholder="เช่น ประตูเปิดอยู่, พบบุคคลแปลกหน้า..." 
          class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"></textarea>
      </div>

      <button type="submit" id="submitBtn" 
        class="w-full bg-indigo-800 hover:bg-indigo-900 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-800/30 transition-all duration-200 flex items-center justify-center space-x-2">
        <i class="fa-solid fa-paper-plane"></i>
        <span>ส่งรายงานจุดตรวจ เลกาซี่</span>
      </button>
    </form>
  </main>

  <script>
    // URL Web App ของเลกาซี่ที่ส่งมาเรียบร้อยแล้ว
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbxFVFtjP2MflrRI2UBdtUeqHRy4ZD70-7OXkMhSshyLiAtR-qwoTVJzpqaDwOi8RPtx/exec";

    let compressedBase64Image = null;
    let checkpointId = "จุดตรวจที่ 1";

    window.addEventListener('DOMContentLoaded', () => {
      startClock();
      parseQueryParams();
      fetchGuardList();
    });

    function parseQueryParams() {
      const urlParams = new URLSearchParams(window.location.search);
      checkpointId = urlParams.get('checkpoint') || urlParams.get('cp') || 'จุดตรวจที่ 1';
      document.getElementById('checkpointName').innerText = checkpointId;
      document.getElementById('checkpointIdText').innerText = `รหัสจุดตรวจ: ${checkpointId}`;
    }

    function startClock() {
      setInterval(() => {
        document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('th-TH');
      }, 1000);
    }

    async function fetchGuardList() {
      try {
        const response = await fetch(`${GAS_ENDPOINT_URL}?action=getGuards`);
        const result = await response.json();
        if (result.success && result.guards && result.guards.length > 0) loadGuardOptions(result.guards);
        else fallbackGuards();
      } catch (err) { fallbackGuards(); }
    }

    function fallbackGuards() { loadGuardOptions(["รปภ. ประจำหมู่บ้าน"]); }

    function loadGuardOptions(guards) {
      const select = document.getElementById('guardSelect');
      select.innerHTML = '<option value="">-- เลือกชื่อเจ้าหน้าที่ รปภ. --</option>';
      guards.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
      const customOpt = document.createElement('option');
      customOpt.value = "CUSTOM_INPUT";
      customOpt.textContent = "✏️ + กรอกชื่ออื่น ๆ เอง...";
      select.appendChild(customOpt);
    }

    function toggleCustomGuardInput() {
      const select = document.getElementById('guardSelect');
      const customWrapper = document.getElementById('customGuardWrapper');
      const customInput = document.getElementById('customGuardInput');
      if (select.value === 'CUSTOM_INPUT') {
        customWrapper.classList.remove('hidden');
        customInput.required = true;
      } else {
        customWrapper.classList.add('hidden');
        customInput.required = false;
      }
    }

    document.getElementById('nativeCameraInput').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function () {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height, MAX = 1024;
          if (width > height && width > MAX) { height *= MAX / width; width = MAX; }
          else if (height > MAX) { width *= MAX / height; height = MAX; }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          compressedBase64Image = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('imagePreview').src = compressedBase64Image;
          document.getElementById('uploadPlaceholder').classList.add('hidden');
          document.getElementById('previewWrapper').classList.remove('hidden');
        };
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('patrolForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const selectVal = document.getElementById('guardSelect').value;
      let finalGuardName = selectVal === 'CUSTOM_INPUT' ? document.getElementById('customGuardInput').value.trim() : selectVal;
      const status = document.querySelector('input[name="status"]:checked').value;
      const note = document.getElementById('noteInput').value.trim();

      if (!finalGuardName || !compressedBase64Image) {
        Swal.fire('แจ้งเตือน', 'กรุณากรอกชื่อและถ่ายรูปภาพให้ครบถ้วน', 'warning');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>กำลังบันทึก...</span>`;

      try {
        const response = await fetch(GAS_ENDPOINT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "submitPatrolScan", siteId: "LEGACY", checkpointId: checkpointId,
            guardId: finalGuardName, status: status, note: note, imageBase64: compressedBase64Image
          })
        });
        const result = await response.json();
        if (result.success) {
          Swal.fire('บันทึกสำเร็จ!', 'ส่งรายงานหมู่บ้านเลกาซี่เรียบร้อย', 'success');
        }
      } catch (error) { Swal.fire('ข้อผิดพลาด', 'เกิดข้อผิดพลาดในการส่งข้อมูล', 'error'); }
      finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>ส่งรายงานจุดตรวจ เลกาซี่</span>`;
      }
    });
  </script>
</body>
</html>
